name: consumer_prt
on:
  pull_request_target:
permissions:
  contents: read
jobs:
  consume:
    runs-on: ubuntu-latest
    steps:
      - name: restore (exact + prefix) in privileged PR-target context
        id: restore
        uses: actions/cache/restore@v4
        with:
          path: cachedir
          key: ci-cache-lab-shared-key-v1
          restore-keys: |
            ci-cache-lab-
      - name: inspect
        run: |
          echo "CONSUMER=pull_request_target event=$GITHUB_EVENT_NAME ref=$GITHUB_REF"
          echo "cache-hit=${{ steps.restore.outputs.cache-hit }} matched-key=${{ steps.restore.outputs.cache-matched-key }}"
          cat cachedir/marker.txt 2>/dev/null && echo "RESULT=POISON-RESTORED" || echo "RESULT=clean-no-marker"
