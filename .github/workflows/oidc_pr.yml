name: oidc_pr
on:
  pull_request:
permissions:
  contents: read
  id-token: write
jobs:
  oidc:
    runs-on: ubuntu-latest
    steps:
      - name: attempt OIDC mint from fork pull_request (read-only expected)
        run: |
          if [ -z "$ACTIONS_ID_TOKEN_REQUEST_URL" ]; then echo "OIDC_PR=UNAVAILABLE (no id-token granted to fork PR)"; exit 0; fi
          T=$(curl -s -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=api://iso-test" | python3 -c 'import sys,json;print(json.load(sys.stdin)["value"])')
          python3 -c "import base64,json;p='$T'.split('.')[1];p+='='*(-len(p)%4);c=json.loads(base64.urlsafe_b64decode(p));print('OIDC_PR=MINTED sub=',c.get('sub'),'repository=',c.get('repository'),'owner=',c.get('repository_owner'),'ref=',c.get('ref'),'event=',c.get('event_name'),'actor=',c.get('actor'))"
