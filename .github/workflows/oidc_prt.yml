name: oidc_prt
on:
  pull_request_target:
permissions:
  contents: read
  id-token: write
jobs:
  oidc:
    runs-on: ubuntu-latest
    steps:
      - name: mint OIDC from privileged pull_request_target, decode identity
        run: |
          if [ -z "$ACTIONS_ID_TOKEN_REQUEST_URL" ]; then echo "OIDC_PRT=UNAVAILABLE"; exit 0; fi
          T=$(curl -s -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=api://iso-test" | python3 -c 'import sys,json;print(json.load(sys.stdin)["value"])')
          python3 -c "import base64,json;p='$T'.split('.')[1];p+='='*(-len(p)%4);c=json.loads(base64.urlsafe_b64decode(p));print('OIDC_PRT=MINTED sub=',c.get('sub'),'repository=',c.get('repository'),'owner=',c.get('repository_owner'),'ref=',c.get('ref'),'event=',c.get('event_name'),'actor=',c.get('actor'))"
